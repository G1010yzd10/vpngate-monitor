name: VPN Gate Monitor

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      max_servers:
        description: "Max servers to test (0 = all of them, always)"
        required: false
        default: "0"
      workers:
        description: "Parallel isolated OpenVPN tunnels"
        required: false
        default: "48"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/vpngate.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: vpngate-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: "Fetch > Log > Clean > Dedupe > Archive > Test > Report"
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenVPN and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          openvpn --version | head -1
          python -m pip install --upgrade -q pip
          python -m pip install -q -r requirements.txt pytest

      - name: Unit tests (parser / cleaner / dedupe)
        run: python -m pytest tests -q

      - name: "Stages 1-5: fetch, log, clean, dedupe, archive"
        shell: bash
        run: |
          mkdir -p logs
          python scripts/fetch.py --data-dir data --archive-dir archive 2>&1 | tee logs/fetch.log

      - name: "Stage 6: test the VPNs (REAL OpenVPN tunnels to every server)"
        shell: bash
        run: |
          sudo python3 scripts/test_vpns.py \
            --data-dir data \
            --workers "${{ github.event.inputs.workers || '48' }}" \
            --max-servers "${{ github.event.inputs.max_servers || '0' }}" \
            2>&1 | tee logs/test.log

      - name: "Stage 7: generate report (README, badges, history)"
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          python scripts/report.py --data-dir data 2>&1 | tee logs/report.log

      - name: Commit and push results
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data archive badges README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(report): automated run #${{ github.run_number }} [skip ci]"
            git pull --rebase --autostash || true
            git push || (sleep 5 && git pull --rebase --autostash && git push)
          fi

      - name: Upload run artifacts (logs, raw CSV, full results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-run-${{ github.run_number }}
          path: |
            logs
            data/summary.json
            data/results.json
            data/servers_clean.csv
            data/latest.json
            data/raw/latest.csv
          retention-days: 30
          if-no-files-found: warn
